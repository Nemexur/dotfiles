# Unbind
unbind %
unbind '"'
unbind a
unbind &
unbind -T copy-mode-vi Enter

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

# Popup
bind -n -N "Toggle popup window" M-i if-shell -F '#{==:#{session_name},popup}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E 'tmux attach-session -t popup || tmux new-session -s popup -c "${HOME}"'
}

# Show history in EDITOR
bind * run-shell '${HOME}/.local/bin/tmux-history'

# Session
bind -n M-s run-shell '${HOME}/.local/bin/tmux-sessionizer'

# Checkout to an existing session
bind -n M-c run-shell '${HOME}/.local/bin/tmux-switch'

# Server
bind K kill-server

# Sessions
bind C new-session

# Windows
bind c command-prompt -p "window name:" "new-window; rename-window '%%'"
bind v split-window -h -l 75 -c "#{pane_current_path}"
bind s split-window -v -l 25 -c "#{pane_current_path}"
bind w kill-window
bind p switch-client -n
bind -n M-n next-window
bind n switch-client -p
bind -n M-p previous-window
bind a last-window
bind -n M-o last-window
bind u choose-tree

# Panes
bind q kill-pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10
